[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffwitness"
version = "0.1.0"
description = "Counterfactual test evidence for Git diffs: discover which patch hunks your tests actually witness."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Thomas Fournier"}]
keywords = ["git", "testing", "ai-coding", "regression", "counterfactual", "code-review"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
diffwitness = "diffwitness.cli:main"

[project.urls]
Homepage = "https://github.com/TFourniax/tooltest"
Repository = "https://github.com/TFourniax/tooltest"

[tool.setuptools.packages.find]
where = ["src"]
