[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffwitness"
version = "0.3.0"
description = "Proof layer for AI-generated code: causal evidence, agent guardrails, and portable patch certificates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Thomas Fournier"}]
keywords = ["git", "testing", "ai-coding", "coding-agents", "regression", "counterfactual", "code-review", "ci", "mutation-testing", "claude-code", "codex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
diffwitness = "diffwitness.cli:main"
dw = "diffwitness.proof_cli:main"

[project.urls]
Homepage = "https://github.com/TFourniax/tooltest"
Repository = "https://github.com/TFourniax/tooltest"

[tool.setuptools.packages.find]
where = ["src"]
