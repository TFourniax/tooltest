name: canonical-public-unit-rerun

on:
  push:
    branches: ["agent/ci-canonical-validation-20260828"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-public-unit-rerun-${{ github.ref }}
  cancel-in-progress: true

env:
  CANONICAL_SHA: a88c25c60f32676fe4354999681042013b9a0a5e

jobs:
  test:
    name: tests / ${{ matrix.os }} / py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact canonical checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - name: Install editable package
        run: python -m pip install -e .
      - name: Check installed dependency graph
        run: python -m pip check
      - name: Compile package and integrations
        run: python -m compileall -q src integrations scripts
      - name: Run unit and integration tests
        shell: bash
        run: python -m unittest discover -s tests -v
      - name: Verify package/runtime version contract
        run: python -c "import diffwitness; from importlib.metadata import version; assert diffwitness.__version__ == version('diffwitness')"
      - name: Smoke public CLIs
        shell: bash
        run: |
          diffwitness --version
          dw --version
          dw --help
          dw doctor --repo .
          dw health --repo . --no-record

  static:
    name: fatal static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Verify exact canonical checkout
        run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - run: python -m pip install ruff
      - run: python -m ruff check src integrations packaging scripts --select F821,F822,F823
