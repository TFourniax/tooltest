name: apply-protect-activation-atomic

on:
  push:
    branches: ["agent/diffwitness-protect-v1-20260901"]
    paths:
      - ".github/workflows/apply-protect-activation-atomic.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/diffwitness-protect-v1-20260901
          fetch-depth: 0
      - name: Apply and validate atomic activation state
        shell: bash
        run: |
          set -euo pipefail
          python scripts/patch_protect_activation_atomic.py
          python -m py_compile src/diffwitness/protect.py tests/test_protect.py
          PYTHONPATH=src python -m unittest discover -s tests -p 'test_protect.py' -v
          git diff --check
      - name: Commit product hardening only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/diffwitness/protect.py tests/test_protect.py
          git commit -m "fix: persist provider activation atomically"
          git push origin HEAD:agent/diffwitness-protect-v1-20260901
