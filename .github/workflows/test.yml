name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m compileall -q src integrations
      - run: python -m unittest discover -s tests -v
      - name: Verify package/runtime version contract
        run: python -c "import diffwitness; from importlib.metadata import version; assert diffwitness.__version__ == version('diffwitness'), (diffwitness.__version__, version('diffwitness'))"
      - run: diffwitness --version
      - run: diffwitness suggest --repo .
      - run: dw --help
      - run: dw doctor --repo .
      - name: Validate plugin and marketplace JSON
        run: python -c "import json, pathlib; paths=['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','.codex-plugin/plugin.json','hooks/claude-hooks.json','hooks/codex-hooks.json','schema/diffwitness-report-v2.schema.json']; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in paths]; print('validated', len(paths), 'JSON contracts')"
      - name: Build wheel smoke test
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip wheel . --no-deps -w dist
