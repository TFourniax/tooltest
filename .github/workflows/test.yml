name: test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Check installed dependency graph
        run: python -m pip check
      - name: Compile package and integrations
        run: python -m compileall -q src integrations
      - name: Run unit and integration tests
        id: unittest
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Preserve unittest diagnostics
        if: ${{ always() && hashFiles('unittest.log') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unittest-${{ runner.os }}-py${{ matrix.python }}
          path: unittest.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify package/runtime version contract
        run: python -c "import diffwitness; from importlib.metadata import version; assert diffwitness.__version__ == version('diffwitness'), (diffwitness.__version__, version('diffwitness'))"
      - name: Smoke public CLIs
        shell: bash
        run: |
          diffwitness --version
          diffwitness suggest --repo .
          dw --version
          dw --help
          dw doctor --repo .
          dw ledger --help
          dw health --repo . --no-record
      - name: Dogfood DiffWitness project health
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: dw health --repo . --no-record --json diffwitness-self-health.json
      - name: Preserve self-health report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12' && hashFiles('diffwitness-self-health.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diffwitness-self-health
          path: diffwitness-self-health.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate plugin, schema, and marketplace JSON
        run: python -c "import json, pathlib; paths=['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','.codex-plugin/plugin.json','hooks/claude-hooks.json','hooks/codex-hooks.json','schema/diffwitness-report-v2.schema.json']; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in paths]; print('validated', len(paths), 'JSON contracts')"
      - name: Build wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python -m pip wheel . --no-deps -w dist
      - name: Smoke installed wheel in clean virtualenv
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        run: |
          python -m venv wheel-smoke
          wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          wheel-smoke/bin/dw --version
          wheel-smoke/bin/dw --help
          wheel-smoke/bin/dw ledger --help
          wheel-smoke/bin/diffwitness --version