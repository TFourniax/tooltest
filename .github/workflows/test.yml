name: test
on:
  pull_request:
  push:
    branches: [main, "agent/debt-ledger"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Check installed dependency graph
        run: python -m pip check
      - name: Compile package and integrations
        run: python -m compileall -q src integrations scripts
      - name: Run unit and integration tests
        id: unittest
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v 2>&1 | tee unittest.log
          rc=${PIPESTATUS[0]}
          echo "return_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Preserve unittest diagnostics
        if: ${{ always() && hashFiles('unittest.log') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: unittest-${{ runner.os }}-py${{ matrix.python }}
          path: unittest.log
          if-no-files-found: error
          retention-days: 7
      - name: Verify package/runtime version contract
        run: python -c "import diffwitness; from importlib.metadata import version; assert diffwitness.__version__ == version('diffwitness'), (diffwitness.__version__, version('diffwitness'))"
      - name: Smoke public CLIs
        shell: bash
        run: |
          diffwitness --version
          diffwitness suggest --repo .
          dw --version
          dw --help
          dw doctor --repo .
          dw protect --help
          dw protect status --json
          dw engine --help
          dw ledger --help
          dw envelope --help
          dw explain --help
          dw portal --help
          dw setup --help
          dw health --repo . --no-record
          idleproof --version
          idleproof --help
      - name: Dogfood DiffWitness project health
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        run: dw health --repo . --no-record --json diffwitness-self-health.json
      - name: Preserve self-health report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14' && hashFiles('diffwitness-self-health.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: diffwitness-self-health
          path: diffwitness-self-health.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate plugin, schema, and marketplace JSON
        run: python -c "import json, pathlib; paths=['.claude-plugin/plugin.json','.claude-plugin/marketplace.json','.codex-plugin/plugin.json','hooks/claude-hooks.json','hooks/codex-hooks.json','schema/diffwitness-report-v2.schema.json','schema/diffwitness-certificate.schema.json','schema/change-envelope-v1.schema.json']; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in paths]; print('validated', len(paths), 'JSON contracts')"

  static:
    name: fatal static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Reject undefined or invalid Python names
        run: |
          python -m pip install ruff
          python -m ruff check src integrations packaging scripts --select F821,F822,F823

  action-e2e:
    name: composite Action end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create harmless WORKTREE candidate
        shell: bash
        run: printf '\n<!-- DiffWitness composite Action E2E -->\n' >> README.md
      - name: Run repository Action exactly as a consumer would
        uses: ./
        with:
          base: HEAD
          candidate: WORKTREE
          policy: balanced
          strategy: auto
          debt: "false"
          ledger-sync: "false"
          upload-certificate: "false"

  package:
    name: release package preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Smoke installed release wheel in clean environment
        shell: bash
        run: |
          python -m venv release-wheel-smoke
          release-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          release-wheel-smoke/bin/python -m pip check
          release-wheel-smoke/bin/dw --version
          release-wheel-smoke/bin/dw --help
          release-wheel-smoke/bin/dw protect --help
          release-wheel-smoke/bin/dw explain --help
          release-wheel-smoke/bin/dw portal --help
          release-wheel-smoke/bin/dw setup --help
          release-wheel-smoke/bin/dw engine --help
          release-wheel-smoke/bin/dw ledger --help
          release-wheel-smoke/bin/dw envelope --help
          release-wheel-smoke/bin/diffwitness --version
          release-wheel-smoke/bin/idleproof --version
          release-wheel-smoke/bin/idleproof --help
          release-wheel-smoke/bin/python -m pip uninstall -y diffwitness
          if release-wheel-smoke/bin/dw --version >/dev/null 2>&1; then
            echo "dw remained executable after uninstall" >&2
            exit 1
          fi
          if release-wheel-smoke/bin/idleproof --version >/dev/null 2>&1; then
            echo "idleproof remained executable after uninstall" >&2
            exit 1
          fi
          release-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          release-wheel-smoke/bin/dw --version
          release-wheel-smoke/bin/dw protect --help
          release-wheel-smoke/bin/dw explain --help
          release-wheel-smoke/bin/idleproof --version
      - uses: actions/upload-artifact@v6
        with:
          name: preflight-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  wheel-e2e:
    name: installed wheel commercial-alpha journeys (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install the exact built wheel
        run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(wheel)])"
      - name: Exercise real Guard + Debt + change-envelope journey
        run: python scripts/alpha_smoke.py
      - name: Exercise private-engine activation + adaptive Gate from installed wheel
        run: python scripts/engine_artifact_smoke.py
      - name: Exercise human acceptance journeys
        run: python scripts/human_acceptance.py
      - name: Rehearse IdleProof explanation, bundled setup, Portal and user-owned inference boundaries
        run: python scripts/idleproof_release_acceptance.py
      - name: Exercise fail-closed recovery journeys
        run: python scripts/recovery_acceptance.py

  binary:
    name: standalone binary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and smoke standalone dw
        shell: bash
        run: |
          python -m pip install . pyinstaller
          python -m pip check
          pyinstaller --clean --onefile --name dw packaging/dw_entry.py
          ./dist/dw --version || ./dist/dw.exe --version
          ./dist/dw --help || ./dist/dw.exe --help
          ./dist/dw protect --help || ./dist/dw.exe protect --help
          ./dist/dw explain --help || ./dist/dw.exe explain --help
          ./dist/dw engine --help || ./dist/dw.exe engine --help
          ./dist/dw ledger --help || ./dist/dw.exe ledger --help
          ./dist/dw envelope --help || ./dist/dw.exe envelope --help
