name: canonical-public-heavy-rerun

on:
  push:
    branches: ["agent/ci-canonical-validation-20260828"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-public-heavy-rerun-${{ github.ref }}
  cancel-in-progress: true

env:
  CANONICAL_SHA: a88c25c60f32676fe4354999681042013b9a0a5e

jobs:
  proofbench:
    name: causal semantics benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - run: |
          python -m pip install .
          python -m pip check
      - run: python benchmarks/proofbench.py --json > proofbench-results.json
      - if: ${{ always() && hashFiles('proofbench-results.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: final-canonical-proofbench-results
          path: proofbench-results.json
          if-no-files-found: error
          retention-days: 30

  continuitybench:
    name: longitudinal Continuity benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - run: python -m pip install -e .
      - run: >-
          python scripts/continuity_bench.py
          --events 10000
          --batch-size 2000
          --context-runs 7
          --max-append-seconds 10
          --max-verify-seconds 2
          --max-rebuild-seconds 5
          --max-context-cold-ms 1000
          --max-context-hot-p95-ms 300
          --json continuitybench.json
      - if: ${{ always() && hashFiles('continuitybench.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: final-canonical-continuitybench-10k
          path: continuitybench.json
          if-no-files-found: error
          retention-days: 30

  action-e2e:
    name: composite Action end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
          fetch-depth: 0
      - run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - shell: bash
        run: printf '\n<!-- final canonical composite Action E2E -->\n' >> README.md
      - uses: ./
        with:
          base: HEAD
          candidate: WORKTREE
          policy: balanced
          strategy: auto
          debt: "false"
          ledger-sync: "false"
          upload-certificate: "false"

  package:
    name: release package preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - shell: bash
        run: |
          python -m venv release-wheel-smoke
          release-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          release-wheel-smoke/bin/python -m pip check
          release-wheel-smoke/bin/dw --version
          release-wheel-smoke/bin/dw --help
          release-wheel-smoke/bin/diffwitness --version

  wheel-e2e:
    name: installed wheel alpha journeys / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify exact canonical checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - run: python -c "import pathlib,subprocess,sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--no-deps',str(wheel)])"
      - run: python scripts/alpha_smoke.py
      - run: python scripts/engine_artifact_smoke.py
      - run: python scripts/human_acceptance.py
      - run: python scripts/recovery_acceptance.py

  binary:
    name: standalone binary / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify exact canonical checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - shell: bash
        run: |
          python -m pip install . pyinstaller
          python -m pip check
          pyinstaller --clean --onefile --name dw packaging/dw_entry.py
          ./dist/dw --version || ./dist/dw.exe --version
          ./dist/dw --help || ./dist/dw.exe --help
          ./dist/dw engine --help || ./dist/dw.exe engine --help
          ./dist/dw ledger --help || ./dist/dw.exe ledger --help
          ./dist/dw envelope --help || ./dist/dw.exe envelope --help

  integrated-product:
    name: native Understand-Prove-Owe-Continuity smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.CANONICAL_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$CANONICAL_SHA"
      - uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest-2
          ref: agent/prealpha-p0-hardening-20260823
          fetch-depth: 0
          path: idleproof
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: python -m py_compile scripts/real_agent_acceptance.py scripts/integrated_product_smoke.py
      - run: python scripts/integrated_product_smoke.py --idleproof-repo ./idleproof
