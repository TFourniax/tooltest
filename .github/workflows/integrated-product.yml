name: integrated-product-smoke

on:
  push:
    branches: ["agent/debt-ledger", "agent/prealpha-p0-hardening-20260823"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrated-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-artifacts:
    name: Native Understand → Prove → Owe → Continuity / exact artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout DiffWitness + Debt Ledger + Continuity
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout matching IdleProof sidecar hardening branch
        uses: actions/checkout@v7
        with:
          repository: TFourniax/tooltest-2
          ref: agent/prealpha-p0-hardening-20260823
          fetch-depth: 0
          path: idleproof
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Syntax-check real authenticated-agent harness and native artifact journey
        run: python -m py_compile scripts/real_agent_acceptance.py scripts/integrated_product_smoke.py
      - name: Exact installed-artifact native alpha path (no guard wrapper)
        run: python scripts/integrated_product_smoke.py --idleproof-repo ./idleproof
