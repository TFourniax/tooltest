name: proofbench
on:
  pull_request:
  push:
    branches: [main, "agent/debt-ledger"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proofbench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proofbench:
    name: causal semantics benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install exact candidate package
        run: |
          python -m pip install .
          python -m pip check
      - name: Run release ProofBench
        run: python benchmarks/proofbench.py --json > proofbench-results.json
      - name: Show benchmark results
        if: ${{ always() && hashFiles('proofbench-results.json') != '' }}
        run: cat proofbench-results.json
      - name: Preserve benchmark evidence
        if: ${{ always() && hashFiles('proofbench-results.json') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: proofbench-results
          path: proofbench-results.json
          if-no-files-found: error
          retention-days: 30
